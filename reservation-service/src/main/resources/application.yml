spring:
  application:
    name: reservation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flashticket}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # Phase 1 only; replaced by Flyway migrations later
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
